spring:
  application:
    name: travel

  # Тајни (API клучеви) се во backend/secrets.properties, кој НЕ се споделува.
  # Пример: backend/secrets.properties.example
  config:
    import: optional:file:./secrets.properties

  # Базата се стартува со docker-compose.yml од главната папка
  datasource:
    url: jdbc:postgresql://localhost:5433/travel
    username: travel
    password: travel

  jpa:
    # Шемата ја креира Flyway (db/migration), Hibernate само проверува дека се совпаѓа
    hibernate:
      ddl-auto: validate
    open-in-view: false

  web:
    error:
      # Пораката од грешката (на пр. „Overpass е преоптоварен“) да стигне до frontend-от
      include-message: always

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          # Lite моделот е побрз и поретко „преоптоварен“ (503) на бесплатниот план.
          # Поквалитетна алтернатива: gemini-3.8-flash
          model: gemini-3.1-flash-lite
          temperature: 0.2       # ниска температура = помалку „креативни“ (измислени) одговори
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            model: gemini-embedding-001
            dimensions: 768      # должина на векторот (мора да се совпаѓа со pgvector подолу)

    # Повторни обиди кон Gemini (кога е „преоптоварен“ 503 или го надминуваме лимитот 429).
    # Стандардно Spring AI пробува 10 пати со чекање 2s → 10s → 50s → 250s... без горна граница,
    # па едно прашање знаеше да „виси“ и по неколку минути. Сега: најмногу 3 обиди за ~3 секунди,
    # а потоа корисникот веднаш добива јасна порака (и може да проба повторно).
    retry:
      max-attempts: 3
      backoff:
        initial-interval: 1s
        multiplier: 2
        max-interval: 4s

    vectorstore:
      pgvector:
        initialize-schema: true  # Spring AI сам ја креира табелата vector_store
        dimensions: 768
        distance-type: cosine-distance
        index-type: hnsw

app:
  chat:
    # При брза привремена грешка (503/429) се прави уште еден обид, со овој модел.
    # Празно = истиот (главниот) модел. Тестирано: gemini-3.8-flash на бесплатниот план
    # не почнува да одговара во рок од 20 s (ни со thinkingLevel LOW), па не е корисен како резерва.
    fallback-model:
  jwt:
    # Таен клуч за потпишување на токените за најава (од secrets.properties)
    secret: ${JWT_SECRET}
